<!DOCTYPE html>

<html lang="de">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Land</title>
  <link rel="stylesheet" href="CSS.css">
  <script src="JavaSkript.js" defer></script>
</head>
  
<body>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="Kärtchen.html">Kärtchen</a></li>

  <header>
    <h1>Das Land</h1>
    <p>Mein eigenes Land</p>
  </header>

  <style>
:root{
--maxw: 1000px;
--accent: #0b5ed7;
--muted: #666;
--card: #ffffff;
--bg: #f4f6f8;
--radius: 12px;
font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
}


*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:#111}


.page{
max-width:var(--maxw);
margin:28px auto;
padding:22px;
}


/* Flagge oben */
.flag-wrap{background:linear-gradient(180deg,#fff, #fbfdff);padding:18px;border-radius:var(--radius);box-shadow:0 6px 18px rgba(18,38,63,0.06);}
h1{font-size:20px;margin:12px 0 10px}


/* Textbox für Geschichte */
.textbox{
background:var(--card);
border:1px solid rgba(16,24,40,0.06);
padding:14px;border-radius:10px;
min-height:120px;max-height:400px;overflow:auto;
}
.textbox[contenteditable]{outline: none}


/* Leader section */
.leader-row{display:flex;gap:18px;align-items:flex-start;margin-top:18px}
.leader-photo{width:220px;flex:0 0 220px;border-radius:10px;height:220px;object-fit:cover}
.leader-about{flex:1}


/* Simple card with image + description */
.simple-card{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.simple-card .caption{font-size:14px;color:var(--muted)}


/* Suche-Box */
.hiring{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#fff,#fcfeff);padding:12px;border-radius:10px;margin-top:18px;border:1px solid rgba(11,94,215,0.06)}
.hiring img{width:110px;height:110px;object-fit:cover;border-radius:8px;flex:0 0 110px}
.hiring .text{font-weight:600}


/* Responsiveness */
@media (max-width:720px){
.leader-row{flex-direction:column;align-items:center}
.leader-photo{width:100%;height:220px;flex:unset}
.hiring{flex-direction:column;text-align:center}
.hiring img{width:70%;height:auto}
}


/* helper small */
.muted{color:var(--muted);font-size:13px}
.label{font-size:13px;color:var(--muted);margin-bottom:6px}
</style>

<body>
  <main class="page">

    <!-- Flaggen-Bereich -->
    <section class="flag-wrap" aria-labelledby="flag-head">

      <img src="Land5.jpg" alt="Landesflagge" class="flag-img" />
      <h1 id="flag-head">Die Flagge von dem Land</h1>
      <div class="textbox" contenteditable="true" aria-label="Geschichte des Landes">
        <strong>Kurze Geschichte:</strong>
        <p>Blabla</p>
        <p>Blablabla</p>
      </div>
    </section>

    <!-- Anführer / Über mich -->
    <section class="leader-row" aria-labelledby="leader-head">
      <img src="Land1.jpg" alt="Ich" class="leader-photo" />
      <div class="leader-about">
        <div class="label" id="leader-head">Über mich</div>
        <div class="textbox" contenteditable="true" role="textbox" aria-label="Über mich">
          <p>Blablablabla</p>
        </div>
      </div>
    </section>

    <section class="simple-card" aria-labelledby="card-head">
      <img src="Land6.jpg" alt="Ein wichtiges Motiv" />
      <div class="caption" id="card-head">Blabla</div>
    </section>

    <!-- Wir suchen dich Box -->
    <section class="hiring" aria-label="Wir suchen dich">
      <img src="Land4.jpg" alt="Aufruf: Wir suchen dich" />
      <div class="text">Wir suchen dich</div>
    </section>

  </main>
</body>
</html>
